# Postgres local para desarrollar la API: docker compose up -d
services:
  db:
    image: postgres:16
    container_name: fitness-db
    environment:
      POSTGRES_USER: fitness
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: fitness
    ports:
      - "5432:5432"
    volumes:
      - datos:/var/lib/postgresql/data

volumes:
  datos:
